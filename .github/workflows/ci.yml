name: CI

on:
  # every PR, whatever its target branch; "synchronize" = every push to the PR's branch
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# a new push to the same branch cancels the run that is already in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Unit and component tests (Vitest + RTL + jest-axe)
        run: yarn test

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      # CI=true is set by GitHub: playwright.config.ts then retries failed tests, forbids test.only
      # and starts its own dev server instead of reusing one
      - name: E2E and accessibility tests (Playwright + axe-core)
        run: yarn test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
